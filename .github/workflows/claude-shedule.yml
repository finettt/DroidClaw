name: Claude Code Scheduled Review
on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9am UTC
  workflow_dispatch:

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 20
          prompt: |
            Review the codebase for any TODO comments and create a summary.
            If you find issues worth addressing, open an issue to track them.
          settings: |
            {
              "env": {
                "NODE_ENV": "test",
                "ANTHROPIC_BASE_URL": "${{ secrets.OPENAI_URL }}",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.LLAMA_CPP_API_KEY }}",
                "ANTHROPIC_DEFAULT_OPUS_MODEL": "ornith-1-5",
                "ANTHROPIC_DEFAULT_SONNET_MODEL": "ornith-1-5",
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": ""
              }
            }
