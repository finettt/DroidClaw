name: Pi Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  pi-agent:
    if: |
      github.actor == 'finettt' && (
        (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/pi ')) ||
        (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, '/pi ')) ||
        (github.event_name == 'pull_request_review' && startsWith(github.event.review.body, '/pi ')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '/pi ') || contains(github.event.issue.title, '/pi ')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for the agent to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Register custom model
        run: |
          mkdir -p ~/.pi/agent
          cat > ~/.pi/agent/models.json << 'EOF'
          {
            "providers": {
              "llama-cpp": {
                "baseUrl": "${{ secrets.OPENAI_URL }}",
                "api": "openai-completions",
                "apiKey": "${{ secrets.LLAMA_CPP_API_KEY }}",
                "models": [
                  { "id": "ornith-1p5" }
                ]
              }
            }
          }
          EOF

      - name: Run Pi agent
        id: pi
        uses: shaftoe/pi-coding-agent-action@2.30.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: llama-cpp
          model: ornith-1p5
          token: ${{ secrets.LLAMA_CPP_API_KEY }}
          base_url: ${{ secrets.OPENAI_URL }}
          # The action only extracts the prompt from comments; for issues
          # events pass the issue body directly (no comment is present).
          prompt: ${{ github.event_name == 'issues' && (github.event.issue.body || github.event.issue.title) }}
